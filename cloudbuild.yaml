steps:
  # Étape 1: Build complet en une seule étape
  - name: 'node:18-alpine'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        echo "📦 Installation des dépendances..."
        npm ci --legacy-peer-deps
        
        echo "🏗️ Build de l'application..."
        npm run build
        
        echo "✅ Build terminé"
    env:
      - 'NODE_ENV=production'
      - 'GENERATE_SOURCEMAP=false'

  # Étape 2: Build de l'image Docker
  - name: 'gcr.io/cloud-builders/docker'
    args: [
      'build',
      '-t', 'gcr.io/$PROJECT_ID/sengreen:latest',
      '.'
    ]

  # Étape 3: Push de l'image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/sengreen:latest']

  # Étape 4: Déploiement sur Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args: [
      'run', 'deploy', 'sengreen',
      '--image', 'gcr.io/$PROJECT_ID/sengreen:latest',
      '--region', 'us-central1',
      '--platform', 'managed',
      '--allow-unauthenticated',
      '--port', '80',
      '--memory', '1Gi',
      '--cpu', '1',
      '--concurrency', '80',
      '--max-instances', '10'
    ]

# Configuration
timeout: '1200s'
options:
  machineType: 'E2_HIGHCPU_8'
  diskSizeGb: 100

images:
  - 'gcr.io/$PROJECT_ID/sengreen:latest'
